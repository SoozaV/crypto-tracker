# Configuración de Alembic. La URL real de la BD se inyecta en env.py desde
# app.config.DATABASE_URL (que a su vez lee .env), así que el valor de aquí es
# solo un placeholder.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./portfolio.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
